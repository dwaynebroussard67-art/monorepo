version: "3.9"
x-db-env: &db-env
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
x-depends: &db-deps
  - postgres
  - redis

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  live-commerce:
    build: { context: .., dockerfile: apps/live-commerce/Dockerfile }
    environment:
      PORT: 4001
      APP_BASE_URL: http://localhost:4001
      <<: *db-env
    depends_on: *db-deps
    ports: ["4001:4001"]
  calendly-meeting-intel:
    build: { context: .., dockerfile: apps/calendly-meeting-intel/Dockerfile }
    environment:
      PORT: 4002
      APP_BASE_URL: http://localhost:4002
