version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  live-commerce:
    build: ../apps/live-commerce
    environment:
      PORT: 4001
      APP_BASE_URL: http://localhost:4001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
    depends_on:
      - postgres
      - redis
    ports:
      - "4001:4001"
  calendly-meeting-intel:
    build: ../apps/calendly-meeting-intel
    environment:
      PORT: 4002
      APP_BASE_URL: http://localhost:4002
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
    depends_on:
      - postgres
      - redis
    ports:
      - "4002:4002"
  patreon-coownership:
